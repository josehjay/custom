[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "custom"
authors = [
    { name = "Custom", email = "dev@example.com" }
]
description = "Custom ERPNext POS extensions"
requires-python = ">=3.11"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    "frappe",
]
# NOTE: Do not re-add pinned git dependencies for packages Frappe already pins
# itself (e.g. gunicorn, pypika). Frappe's own pyproject.toml is the single
# source of truth for those pins; duplicating them here goes stale every time
# Frappe bumps its pin and breaks `uv` resolution with "conflicting URLs for
# package" errors. See scripts/check_frappe_pins.py and the CI workflow that
# guards against this regressing.

[project.urls]
Homepage = "https://example.com/custom"
